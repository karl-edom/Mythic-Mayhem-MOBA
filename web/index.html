<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mythic Mayhem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  /* Layout: full-screen canvas game; light, sunny single theme on purpose (brief: bright and cheerful). */
  :root {
    --bg: #f4f8ff;
    --panel: #ffffff;
    --ink: #1f2a44;
    --muted: #66708a;
    --line: #dde5f3;
    --blue: #2f7bf5;
    --red: #f25a3a;
    --gold: #f2b21b;
    --ok: #3cc45a;
    --shadow: 0 6px 24px rgba(31, 42, 68, 0.12);
    --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
    --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); overflow: hidden; }
  button { font: inherit; cursor: pointer; }
  #game { position: fixed; inset: 0; display: block; }
  .screen { position: fixed; inset: 0; overflow: auto; padding: 24px 16px; background: linear-gradient(160deg, #eaf4ff 0%, #fff6e8 100%); }
  .hidden { display: none !important; }
  h1 { margin: 0 0 4px; font: 700 40px/1.1 var(--font-display); letter-spacing: -0.5px; text-wrap: balance; }
  h1 span { color: var(--blue); }
  h2 { font-size: 16px; margin: 22px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .wrap { max-width: 1040px; margin: 0 auto; }
  .sub { color: var(--muted); margin: 0 0 8px; }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 12px; text-align: left; box-shadow: var(--shadow); transition: transform .08s, border-color .08s; }
  .card:hover { transform: translateY(-2px); }
  .card.sel { border-color: var(--blue); }
  .card .t { font: 600 17px/1.2 var(--font-display); }
  .card .m { color: var(--muted); font-size: 13px; }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 6px; }
  .order { float: right; background: var(--blue); color: #fff; border-radius: 10px; padding: 0 8px; font-weight: 700; }
  .play { font-family: var(--font-display) !important; margin: 24px 0 40px; padding: 14px 40px; font-size: 18px; font-weight: 700; color: #fff; background: var(--blue); border: none; border-radius: 14px; box-shadow: var(--shadow); }
  .play:disabled { opacity: .5; cursor: default; }
  .keys { color: var(--muted); font-size: 13px; }
  kbd { background: #fff; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 0 6px; font: 12px ui-monospace, monospace; }

  #hud { position: fixed; inset: 0; pointer-events: none; }
  #top { font-family: var(--font-display); font-variant-numeric: tabular-nums; position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: var(--panel); border-radius: 14px; padding: 6px 16px; box-shadow: var(--shadow); font-weight: 700; display: flex; gap: 14px; align-items: center; }
  #top .b { color: var(--blue); } #top .r { color: var(--red); }
  #toast { position: absolute; top: calc(58px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); background: rgba(31,42,68,.85); color: #fff; padding: 6px 14px; border-radius: 12px; font-weight: 600; opacity: 0; transition: opacity .2s; }
  #toast.on { opacity: 1; }
  #bar { position: absolute; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 12px; background: var(--panel); border-radius: 16px; padding: 10px 14px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: flex-end; max-width: calc(100vw - 220px); }
  .stat { min-width: 190px; }
  .stat .name { font-weight: 700; }
  .meter { height: 10px; background: #edf1f8; border-radius: 6px; overflow: hidden; margin-top: 4px; position: relative; }
  .meter > i { position: absolute; inset: 0 auto 0 0; display: block; }
  .meter.hp > i { background: var(--ok); } .meter.mp > i { background: #4b8df0; } .meter.xp > i { background: #b98af0; }
  .meter.xp { height: 6px; }
  .small { font-size: 12px; color: var(--muted); }
  .skills { display: flex; gap: 8px; }
  .sk { width: 62px; height: 62px; border-radius: 12px; background: #f1f5fc; border: 2px solid var(--line); position: relative; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 10px; line-height: 1.15; font-weight: 600; overflow: hidden; padding: 12px 3px 2px; word-break: break-word; }
  .sk .k { position: absolute; top: 2px; left: 5px; font-size: 11px; color: var(--muted); }
  .sk .cd { position: absolute; inset: 0; background: rgba(31,42,68,.55); color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .sk.locked { opacity: .35; }
  .items { display: flex; flex-direction: column; gap: 3px; min-width: 190px; }
  .it { font-size: 12px; } .it b { color: var(--gold); }
  #choice { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; pointer-events: auto; }
  #choice .card { width: 220px; }
  #dead { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(31,42,68,.8); color: #fff; padding: 14px 24px; border-radius: 14px; font-size: 20px; font-weight: 700; }
  #minimap { position: absolute; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 180px; height: 180px; border-radius: 14px; box-shadow: var(--shadow); background: #fff; }
  #help { position: absolute; left: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); max-width: calc(50vw - 120px); background: rgba(255,255,255,.9); border-radius: 12px; padding: 6px 10px; font-size: 12px; line-height: 1.9; color: var(--muted); }
  table { border-collapse: collapse; background: var(--panel); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  td, th { padding: 6px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .touch-note { display: none; color: var(--red); font-weight: 700; }
  @media (hover: none), (max-width: 760px) { .touch-note { display: block; } }
  #banner { position: absolute; top: calc(64px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); font: 700 28px/1.1 var(--font-display); color: #fff; padding: 8px 22px; border-radius: 16px; opacity: 0; transition: opacity .2s; white-space: nowrap; box-shadow: var(--shadow); }
  #banner.on { opacity: 1; }
  #banner.b { background: var(--blue); } #banner.r { background: var(--red); } #banner.n { background: rgba(31,42,68,.85); }
  #feed { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  #feed div { background: rgba(255,255,255,.92); border-radius: 10px; padding: 3px 10px; font-size: 13px; font-weight: 700; box-shadow: var(--shadow); }
  #feed .b { color: var(--blue); } #feed .r { color: var(--red); }
  #score { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(980px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; background: rgba(255,255,255,.97); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 16px; font-variant-numeric: tabular-nums; }
  #score .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; font: 700 18px var(--font-display); margin-bottom: 8px; flex-wrap: wrap; }
  #score .head .b { color: var(--blue); } #score .head .r { color: var(--red); }
  #score .obj { font: 600 13px var(--font-body); color: var(--muted); }
  #score table { width: 100%; table-layout: fixed; box-shadow: none; border-radius: 0; margin-bottom: 10px; font-size: 13px; }
  #score th:nth-child(1) { width: 19%; } #score th:nth-child(2) { width: 6%; } #score th:nth-child(3) { width: 11%; } #score th:nth-child(4) { width: 11%; }
  #score th:nth-child(5) { width: 8%; } #score th:nth-child(6) { width: 8%; } #score th:nth-child(7) { width: 23%; } #score th:nth-child(8) { width: 14%; }
  #score th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  #score td, #score th { padding: 5px 8px; }
  #score tr.me td { background: #fff8db; }
  #score tr.dead td { color: var(--muted); }
  #score .lvl { display: inline-block; min-width: 24px; text-align: center; background: #efe6ff; color: #6b3fc4; border-radius: 8px; font-weight: 800; }
  #score .its { font-size: 12px; } #score .its b { color: var(--gold); }
  #score .team-b td:first-child { border-left: 4px solid var(--blue); } #score .team-r td:first-child { border-left: 4px solid var(--red); }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } #toast, #banner { transition: none; } }
  @media (max-width: 760px) { #bar { flex-wrap: wrap; max-width: calc(100vw - 150px); } #minimap { width: 120px; height: 120px; } .stat, .items { min-width: 130px; } #help { display: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <div id="top"><span class="b" id="kb">0</span><span id="clock">0:00</span><span class="r" id="kr">0</span></div>
  <div id="toast"></div>
  <div id="banner"></div>
  <div id="feed"></div>
  <div id="help"><kbd>ZQSD</kbd>/<kbd>WASD</kbd> bouger · <kbd>Espace</kbd>/clic attaquer · <kbd>A</kbd><kbd>E</kbd><kbd>R</kbd> compétences · <kbd>F</kbd> sort · <kbd>B</kbd> base · <kbd>Tab</kbd> tableau</div>
  <div id="choice" class="hidden"></div>
  <div id="dead" class="hidden"></div>
  <div id="bar"></div>
  <canvas id="minimap" width="360" height="360"></canvas>
  <div id="score" class="hidden"></div>
</div>
<div id="menu" class="screen"></div>
<div id="end" class="screen hidden"></div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
